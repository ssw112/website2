<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>beware.today — coming soon</title>
	<meta name="description" content="beware.today is under construction. Contact: contact@beware.today" />
	<meta property="og:title" content="beware.today" />
	<meta property="og:description" content="Site under construction. Contact: contact@beware.today" />
	<meta property="og:url" content="https://beware.today/" />
	<meta property="og:type" content="website" />
	<style>
		:root {
			--bg: #0f1115;
			--text: #e8e6e1;
			--muted: #9aa0ab;
			--accent: #d9a441;
			--line: #262b35;
		}
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			background: var(--bg);
			color: var(--text);
			font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 2rem 1.25rem;
		}
		main { max-width: 560px; width: 100%; }
		.kicker {
			color: var(--accent);
			font-size: .8rem;
			letter-spacing: .22em;
			text-transform: uppercase;
			margin-bottom: 1rem;
		}
		h1 { font-size: 2rem; font-weight: 650; line-height: 1.25; margin-bottom: 1rem; }
		p.lead { color: var(--muted); }
		footer {
			margin-top: 2.5rem;
			padding-top: 1.25rem;
			border-top: 1px solid var(--line);
			color: var(--muted);
			font-size: .9rem;
		}
		footer a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--accent); }
		footer a:hover { color: var(--accent); }
		@media (prefers-color-scheme: light) {
			:root { --bg: #faf8f4; --text: #1c1e24; --muted: #5c6470; --line: #e3ded4; }
		}
	</style>
</head>
<body>
	<main>
		<div class="kicker">beware.today</div>
		<h1>We're working on it.</h1>
		<p class="lead">This site is under construction. Check back soon.</p>
		<footer>
			<a href="mailto:contact@beware.today">contact@beware.today</a>
		</footer>
	</main>
</body>
</html>
